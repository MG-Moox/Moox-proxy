# Moox on your own server: the app plus Caddy, which gets a free HTTPS
# certificate for your domain automatically. Started by setup.sh.
services:
  moox:
    build:
      context: ../..
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - moox
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
