<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Moox" />
		<title>Moox Proxy</title>
		<meta name="theme-color" content="#111111" />
		<link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
		<!-- Runs first so your theme is applied before the page paints -->
		<script src="settings.js"></script>
		<link rel="stylesheet" href="style.css" />
		<!-- Order matters: Scramjet bundle, then BareMux -->
		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>
		<script src="register-sw.js" defer></script>
		<script src="search.js" defer></script>
		<script src="store.js" defer></script>
		<script src="suggest.js" defer></script>
		<script src="account.js" defer></script>
		<script src="bg.js" defer></script>
		<script src="home.js" defer></script>
		<script src="apps.js" defer></script>
		<script src="mobile.js" defer></script>
		<script src="menu.js" defer></script>
		<script src="app.js" defer></script>
	</head>
	<body>
		<!-- Tab strip, shown once a tab is open -->
		<div id="tabs" hidden>
			<div id="tab-list" role="tablist" aria-label="Open tabs"></div>
			<button id="btn-newtab" type="button" title="New tab (T)" aria-label="New tab">+</button>
		</div>

		<!-- Browser bar, shown while a site is open -->
		<header id="bar" hidden>
			<button id="btn-home" title="Close page (H)" aria-label="Close page and go home">&#8962;</button>
			<button id="btn-back" title="Back" aria-label="Back">&#8249;</button>
			<button id="btn-forward" title="Forward" aria-label="Forward">&#8250;</button>
			<button id="btn-reload" title="Reload" aria-label="Reload">&#10227;</button>
			<form id="bar-form">
				<input id="bar-address" type="text" autocomplete="off" aria-label="Address" />
			</form>
			<button id="bar-time" class="time-pill" type="button" hidden title="Time left today"></button>
			<button id="btn-fav" title="Add to favorites" aria-label="Favorite">&#9734;</button>
			<button id="btn-menu" title="Menu (M)" aria-label="Menu" aria-haspopup="dialog" aria-expanded="false">&#9776;</button>
		</header>

		<main id="home">
			<button id="btn-menu-home" class="corner" title="Menu (M)" aria-label="Menu" aria-haspopup="dialog" aria-expanded="false">&#9776;</button>

			<button id="home-time" class="time-pill corner-left" type="button" hidden title="Time left today"></button>

			<div id="clock" hidden>
				<div id="clock-time"></div>
				<div id="clock-date"></div>
			</div>
			<p id="greeting" hidden></p>
			<button id="weather-mini" type="button" class="chip" hidden></button>

			<h1>Moox Proxy</h1>
			<form id="form">
				<input id="address" type="text" placeholder="Search or enter a website" aria-label="Search or enter a website" autocomplete="off" autofocus required />
				<button type="submit">Go</button>
			</form>
			<p id="error" class="err" role="alert"></p>
			<pre id="error-code" class="err"></pre>

			<section id="tools" aria-label="Tools">
				<button type="button" class="chip" data-tool="apps"><span aria-hidden="true">&#127918;</span> Apps</button>
				<button type="button" class="chip" data-tool="calc"><span aria-hidden="true">&#129518;</span> Calculator</button>
				<button type="button" class="chip" data-tool="weather"><span aria-hidden="true">&#127780;&#65039;</span> Weather</button>
				<button type="button" class="chip" data-tool="timer"><span aria-hidden="true">&#9201;&#65039;</span> Timer</button>
				<button type="button" class="chip" data-tool="notes"><span aria-hidden="true">&#128221;</span> Notes</button>
			</section>

			<section id="quick" aria-label="Quick links" hidden>
				<div id="quick-grid"></div>
			</section>

			<section id="recent" aria-label="Recent sites" hidden>
				<div id="recent-row"></div>
			</section>

			<section id="favs" aria-label="Favorites">
				<button id="fav-edit" type="button" class="chip" aria-pressed="false">Edit favorites</button>
				<div id="fav-grid"></div>
			</section>
		</main>

		<footer id="foot"><button id="version" type="button" title="What's new" aria-label="Version, tap to see what's new"></button></footer>

		<!-- Tools panel: calculator, weather, timer, notes (filled in by home.js) -->
		<div id="tool" hidden>
			<div class="tool-card" role="dialog" aria-modal="true" aria-labelledby="tool-title">
				<div class="tool-head">
					<h2 id="tool-title"></h2>
					<button id="tool-close" type="button" aria-label="Close">&times;</button>
				</div>
				<div id="tool-body"></div>
			</div>
		</div>

		<!-- Friendly page for sites that fail to load (filled in by app.js) -->
		<div id="site-error" hidden></div>

		<!-- Menu: history, settings and extras. Filled in by menu.js -->
		<div id="menu" role="dialog" aria-label="Menu" hidden>
			<div class="tabs" role="tablist" aria-label="Menu sections">
				<button type="button" class="tab" role="tab" data-tab="account" id="tab-account" hidden>Account</button>
				<button type="button" class="tab" role="tab" data-tab="history" id="tab-history">History</button>
				<button type="button" class="tab" role="tab" data-tab="settings" id="tab-settings">Settings</button>
				<button type="button" class="tab" role="tab" data-tab="more" id="tab-more">More</button>
			</div>
			<div id="menu-body" role="tabpanel"></div>
		</div>

		<!-- Account: time-left banner and the "used up" screen (filled in by account.js) -->
		<div id="announce-banner" role="status" hidden></div>
		<div id="app-warn" role="note" hidden></div>
		<div id="limit-banner" role="status" hidden></div>
		<div id="limit-overlay" role="dialog" aria-modal="true" aria-labelledby="limit-title" hidden></div>

		<ul id="suggest" role="listbox" aria-label="Suggestions" hidden></ul>
	</body>
</html>
